spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/card_mall_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
  flyway:
    enabled: true
    clean-disabled: false
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1

card-mall:
  store-id: 1
  jwt:
    secret: test-jwt-secret-please-change-me-32bytes
  mock:
    enabled: true
  verify:
    code-ttl-seconds: 2
    max-times-per-verify: 10
  pay:
    channel: mock
  wx:
    mock: true
    app-id: ""
    app-secret: ""
